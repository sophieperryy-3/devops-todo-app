name: Continuous Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '18'

jobs:
  # Build and Test (reuse CI pipeline)
  build-and-test:
    name: Build and Test
    uses: ./.github/workflows/ci.yml

  # Deploy Infrastructure
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    outputs:
      load-balancer-dns: ${{ steps.terraform-output.outputs.load_balancer_dns }}
      frontend-bucket: ${{ steps.terraform-output.outputs.frontend_bucket_name }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.0
        terraform_wrapper: false

    - name: Terraform Init
      run: |
        cd infrastructure
        terraform init

    - name: Terraform Plan
      run: |
        cd infrastructure
        terraform plan \
          -var="environment=${{ github.event.inputs.environment || 'dev' }}" \
          -var="db_password=${{ secrets.DB_PASSWORD }}" \
          -out=tfplan

    - name: Terraform Apply
      run: |
        cd infrastructure
        terraform apply -auto-approve tfplan

    - name: Get Terraform Outputs
      id: terraform-output
      run: |
        cd infrastructure
        echo "load_balancer_dns=$(terraform output -raw load_balancer_dns)" >> $GITHUB_OUTPUT
        echo "frontend_bucket_name=$(terraform output -raw frontend_bucket_name)" >> $GITHUB_OUTPUT

  # Deploy Backend Application
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy-infrastructure]
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Download backend build
      uses: actions/download-artifact@v4
      with:
        name: backend-build
        path: backend/dist/

    - name: Create deployment package
      run: |
        cd backend
        zip -r ../backend-deployment.zip . -x "node_modules/*" "src/*" "*.ts" "tsconfig.json"

    - name: Deploy to EC2 instances
      run: |
        # Get instance IDs from Auto Scaling Group
        ASG_NAME=$(aws autoscaling describe-auto-scaling-groups \
          --query "AutoScalingGroups[?contains(Tags[?Key=='Name'].Value, 'interactive-todo-app-asg')].AutoScalingGroupName" \
          --output text)
        
        INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-instances \
          --query "AutoScalingInstances[?AutoScalingGroupName=='$ASG_NAME'].InstanceId" \
          --output text)
        
        # Deploy to each instance
        for INSTANCE_ID in $INSTANCE_IDS; do
          echo "Deploying to instance: $INSTANCE_ID"
          
          # Send deployment command
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo systemctl stop todo-app",
              "cd /opt/todo-app/backend",
              "sudo rm -rf dist/",
              "sudo mkdir -p dist/",
              "echo \"Deployment completed for backend\"",
              "sudo systemctl start todo-app",
              "sudo systemctl status todo-app"
            ]' \
            --output text
        done

  # Deploy Frontend Application
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy-infrastructure]
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Build frontend for production
      env:
        VITE_API_URL: http://${{ needs.deploy-infrastructure.outputs.load-balancer-dns }}
      run: |
        cd frontend
        npm run build

    - name: Deploy to S3
      run: |
        aws s3 sync frontend/dist/ s3://${{ needs.deploy-infrastructure.outputs.frontend-bucket }}/ \
          --delete \
          --cache-control "public, max-age=31536000" \
          --exclude "*.html" \
          --exclude "service-worker.js"
        
        # Upload HTML files with no cache
        aws s3 sync frontend/dist/ s3://${{ needs.deploy-infrastructure.outputs.frontend-bucket }}/ \
          --delete \
          --cache-control "no-cache" \
          --include "*.html" \
          --include "service-worker.js"

  # Post-Deployment Tests
  post-deployment-tests:
    name: Post-Deployment Tests
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, deploy-infrastructure]
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Wait for deployment to be ready
      run: |
        echo "Waiting for application to be ready..."
        sleep 60

    - name: Health Check - Backend
      run: |
        BACKEND_URL="http://${{ needs.deploy-infrastructure.outputs.load-balancer-dns }}"
        
        # Wait for backend to be healthy
        for i in {1..30}; do
          if curl -f "$BACKEND_URL/health"; then
            echo "Backend is healthy!"
            break
          fi
          echo "Waiting for backend... (attempt $i/30)"
          sleep 10
        done

    - name: Health Check - Frontend
      run: |
        FRONTEND_URL="http://${{ needs.deploy-infrastructure.outputs.frontend-bucket }}.s3-website-${{ env.AWS_REGION }}.amazonaws.com"
        
        # Check if frontend is accessible
        if curl -f "$FRONTEND_URL"; then
          echo "Frontend is accessible!"
        else
          echo "Frontend health check failed"
          exit 1
        fi

    - name: API Smoke Tests
      run: |
        BACKEND_URL="http://${{ needs.deploy-infrastructure.outputs.load-balancer-dns }}"
        
        # Test API endpoints
        echo "Testing API endpoints..."
        
        # Test health endpoint
        curl -f "$BACKEND_URL/health" | jq .
        
        # Test tasks endpoint
        curl -f "$BACKEND_URL/api/tasks" | jq .
        
        echo "All smoke tests passed!"

    - name: Performance Test
      run: |
        BACKEND_URL="http://${{ needs.deploy-infrastructure.outputs.load-balancer-dns }}"
        
        # Simple performance test
        echo "Running performance test..."
        
        for i in {1..10}; do
          START_TIME=$(date +%s%N)
          curl -s "$BACKEND_URL/health" > /dev/null
          END_TIME=$(date +%s%N)
          DURATION=$((($END_TIME - $START_TIME) / 1000000))
          echo "Request $i: ${DURATION}ms"
        done

  # Notification
  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [post-deployment-tests, deploy-infrastructure]
    if: always()
    
    steps:
    - name: Notify Success
      if: needs.post-deployment-tests.result == 'success'
      run: |
        echo "🎉 Deployment successful!"
        echo "Frontend: http://${{ needs.deploy-infrastructure.outputs.frontend-bucket }}.s3-website-${{ env.AWS_REGION }}.amazonaws.com"
        echo "Backend: http://${{ needs.deploy-infrastructure.outputs.load-balancer-dns }}"

    - name: Notify Failure
      if: needs.post-deployment-tests.result == 'failure'
      run: |
        echo "❌ Deployment failed!"
        echo "Check the logs for more details."
        exit 1