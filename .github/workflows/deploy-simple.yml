name: Deploy to AWS S3

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '18'

jobs:
  deploy-frontend:
    name: 🚀 Deploy Frontend to S3
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: 📦 Install dependencies
      run: |
        cd frontend
        npm install

    - name: 🏗️ Build frontend
      run: |
        cd frontend
        npm run build

    - name: 🔧 Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: 🪣 Create S3 bucket (if not exists)
      run: |
        BUCKET_NAME="devops-todo-app-${{ github.run_number }}"
        echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
        
        # Create bucket
        aws s3 mb s3://$BUCKET_NAME --region ${{ env.AWS_REGION }} || echo "Bucket might already exist"

    - name: 📤 Deploy to S3 with public-read ACL
      run: |
        aws s3 sync frontend/dist/ s3://${{ env.BUCKET_NAME }}/ --delete --acl public-read

    - name: 🎉 Get website URL
      run: |
        WEBSITE_URL="https://${{ env.BUCKET_NAME }}.s3.${{ env.AWS_REGION }}.amazonaws.com/index.html"
        echo "🌐 Your website is accessible at: $WEBSITE_URL"
        echo "WEBSITE_URL=$WEBSITE_URL" >> $GITHUB_ENV
        
    - name: 📋 Create deployment summary
      run: |
        echo "# 🎉 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 🌐 Your Live Website:" >> $GITHUB_STEP_SUMMARY
        echo "**${{ env.WEBSITE_URL }}**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 📊 Deployment Details:" >> $GITHUB_STEP_SUMMARY
        echo "- **Bucket**: ${{ env.BUCKET_NAME }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY